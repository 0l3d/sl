name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and Test Standard
        run: |
          make all nonetwork
          make test

      - name: Distribute Standard
        run: make distribute DIST_NAME=sl-linux-x86_64-${{ github.ref_name }}

      - name: Build and Test Musl
        run: |
          make clean
          make musl musl-nonetwork
          make test

      - name: Distribute Musl
        run: make distribute DIST_NAME=sl-linux-musl-x86_64-${{ github.ref_name }}

      - name: Upload Linux Standard package
        uses: actions/upload-artifact@v4
        with:
          name: sl-linux-x86_64
          path: package/sl-linux-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

      - name: Upload Linux Musl package
        uses: actions/upload-artifact@v4
        with:
          name: sl-linux-musl-x86_64
          path: package/sl-linux-musl-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          make all nonetwork
          make test

      - name: Distribute
        run: make distribute DIST_NAME=sl-macos-arm64-${{ github.ref_name }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: sl-macos-arm64
          path: package/sl-macos-arm64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            make
            zip

      - name: Build and Test
        shell: msys2 {0}
        run: |
          make all nonetwork
          make test

      - name: Distribute
        shell: msys2 {0}
        run: make distribute DIST_NAME=sl-windows-x86_64-${{ github.ref_name }}

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: sl-windows-x86_64
          path: package/sl-windows-x86_64-${{ github.ref_name }}.zip
          if-no-files-found: error

  build-freebsd:
    name: Build FreeBSD x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Distribute
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y gmake
          run: |
            gmake all nonetwork
            gmake test
            gmake distribute DIST_NAME=sl-freebsd-x86_64-${{ github.ref_name }}

      - name: Upload FreeBSD package
        uses: actions/upload-artifact@v4
        with:
          name: sl-freebsd-x86_64
          path: package/sl-freebsd-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-openbsd:
    name: Build OpenBSD x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Distribute
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add gmake
          run: |
            gmake all nonetwork
            gmake test
            gmake distribute DIST_NAME=sl-openbsd-x86_64-${{ github.ref_name }}

      - name: Upload OpenBSD package
        uses: actions/upload-artifact@v4
        with:
          name: sl-openbsd-x86_64
          path: package/sl-openbsd-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-netbsd:
    name: Build NetBSD x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Distribute
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add gmake
          run: |
            gmake all nonetwork
            gmake test
            gmake distribute DIST_NAME=sl-netbsd-x86_64-${{ github.ref_name }}

      - name: Upload NetBSD package
        uses: actions/upload-artifact@v4
        with:
          name: sl-netbsd-x86_64
          path: package/sl-netbsd-x86_64-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
      - build-netbsd
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify all packages exist
        shell: bash
        run: |
          set -euxo pipefail
          find dist -maxdepth 1 -type f -print
          test -f "dist/sl-linux-x86_64-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/sl-linux-musl-x86_64-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/sl-macos-arm64-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/sl-windows-x86_64-${GITHUB_REF_NAME}.zip"
          test -f "dist/sl-freebsd-x86_64-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/sl-openbsd-x86_64-${GITHUB_REF_NAME}.tar.gz"
          test -f "dist/sl-netbsd-x86_64-${GITHUB_REF_NAME}.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          test -f CHANGELOG.md
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SL ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --generate-notes \
            dist/*
